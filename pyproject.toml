[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krishibazaar"
version = "0.1.0"
description = "Autonomous farm-to-market negotiation agent network for Indian farmers (ASI:One native)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uagents>=0.26.0,<0.27.0",
    "uagents-core>=0.4.11,<0.5.0",
    "pydantic>=2.8.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0,<0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]
